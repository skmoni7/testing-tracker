name: Build Android APK (Preview)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify config files
        working-directory: mobile
        run: |
          echo "=== app.json ==="
          cat app.json
          echo "=== eas.json ==="
          cat eas.json

      - name: Build Android APK
        working-directory: mobile
        run: eas build --platform android --profile preview --non-interactive --no-wait

      - name: Done
        run: echo "Build submitted! Check https://expo.dev for your APK download link."
