name: Build Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'mobile-native/**'

jobs:
  build:
    name: Build Native Kotlin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
        working-directory: mobile-native

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: mobile-native/app/build/outputs/apk/debug/app-debug.apk
