name: Build Native Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Native Kotlin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x mobile-native/gradlew
        working-directory: .

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: mobile-native

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProTrack-Native-Debug
          path: mobile-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
